<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso de Clientes | KEHO-Technology</title>
  <link rel="stylesheet" href="../Login/Login.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    .auth-page-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      background: radial-gradient(circle at 50% 20%, rgba(6, 182, 212, 0.12) 0%, #050811 80%);
    }

    .auth-box-card {
      width: 100%;
      max-width: 440px;
      background: #0f172a;
      border: 1px solid rgba(6, 182, 212, 0.3);
      border-radius: var(--radius-lg);
      padding: 2.25rem 2rem;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85);
    }

    .auth-top-header {
      text-align: center;
      margin-bottom: 1.75rem;
    }

    .auth-top-header .brand-badge {
      margin: 0 auto 0.85rem;
      width: 48px;
      height: 48px;
      font-size: 1.4rem;
    }

    .auth-top-header h2 {
      font-size: 1.4rem;
      font-weight: 800;
      color: #fff;
    }

    .auth-top-header p {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .auth-form-step {
      display: none;
    }

    .auth-form-step.active {
      display: flex;
      flex-direction: column;
      gap: 1.15rem;
    }

    .btn-google-auth {
      background: #1e293b;
      border: 1px solid var(--border-color);
      color: #fff;
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      transition: all 0.2s;
    }

    .btn-google-auth:hover {
      border-color: var(--accent-cyan);
      background: #283548;
    }

    .auth-divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.75rem;
      margin: 0.5rem 0;
    }

    .auth-divider::before, .auth-divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border-color);
    }

    .auth-divider span {
      padding: 0 0.75rem;
    }

    .form-group-field {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .form-group-field label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .form-group-field input {
      width: 100%;
      background: #080d18;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 0.75rem 1rem;
      border-radius: var(--radius-sm);
      outline: none;
      font-size: 0.9rem;
      transition: border-color 0.2s;
    }

    .form-group-field input:focus {
      border-color: var(--accent-cyan);
    }

    .auth-error-msg {
      display: none;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      padding: 0.65rem 0.85rem;
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      text-align: center;
    }

    .auth-toggle-bar {
      text-align: center;
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border-color);
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .auth-toggle-link {
      color: var(--accent-cyan);
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      margin-left: 4px;
    }

    .auth-toggle-link:hover {
      text-decoration: underline;
    }

    .back-home-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      font-size: 0.8rem;
      text-decoration: none;
      margin-bottom: 1rem;
      transition: color 0.2s;
    }

    .back-home-link:hover {
      color: var(--accent-cyan);
    }

    /* ESTILOS DEL SELECTOR DE CUENTAS DE GOOGLE CUSTOM */
    .google-modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(6px);
      z-index: 99999;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .google-modal-backdrop.open {
      display: flex;
    }

    .google-account-card {
      width: 100%;
      max-width: 400px;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 1.75rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      text-align: center;
    }

    .google-card-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }

    .google-card-header h3 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
    }

    .google-card-header p {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .google-accounts-list {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      margin-bottom: 1.25rem;
    }

    .account-item-btn {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border-color);
      padding: 0.75rem 1rem;
      border-radius: 12px;
      cursor: pointer;
      text-align: left;
      transition: border-color 0.2s, background 0.2s;
    }

    .account-item-btn:hover {
      border-color: var(--accent-cyan);
      background: #162032;
    }

    .account-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      color: #080d18;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }

    .account-details {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .account-name {
      font-size: 0.88rem;
      font-weight: 700;
      color: #fff;
    }

    .account-email {
      font-size: 0.78rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-close-google-modal {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      width: 100%;
    }

    .btn-close-google-modal:hover {
      color: #fff;
      border-color: #fff;
    }
  </style>
</head>
<body>

  <div class="auth-page-wrapper">
    <div class="auth-box-card">
      <a href="../Login/Login.html" class="back-home-link">
        ← Volver al catálogo principal
      </a>

      <div class="auth-top-header">
        <div class="brand-badge">K</div>
        <h2 id="authCardTitle">Ingresar a tu Cuenta</h2>
        <p id="authCardSubtitle">Accede para gestionar tus pedidos y compras en KEHO-Technology</p>
      </div>

      <div class="auth-error-msg" id="authErrorMsg"></div>

      <!-- FORMULARIO 1: INICIAR SESIÓN -->
      <form id="loginForm" class="auth-form-step active" novalidate>
        <button type="button" class="btn-google-auth" id="btnGoogleLogin">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span>Continuar con Google</span>
        </button>

        <div class="auth-divider">
          <span>o ingresa con tu correo</span>
        </div>

        <div class="form-group-field">
          <label for="loginEmail">Correo Electrónico</label>
          <input type="email" id="loginEmail" placeholder="ejemplo@correo.com" required>
        </div>

        <div class="form-group-field">
          <label for="loginPass">Contraseña</label>
          <input type="password" id="loginPass" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary full" style="padding: 0.8rem; margin-top: 0.25rem;">
          Iniciar Sesión
        </button>
      </form>

      <!-- FORMULARIO 2: CREAR CUENTA -->
      <form id="registerForm" class="auth-form-step" novalidate>
        <button type="button" class="btn-google-auth" id="btnGoogleRegister">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span>Registrarse con Google</span>
        </button>

        <div class="auth-divider">
          <span>o completa tus datos</span>
        </div>

        <div class="form-group-field">
          <label for="regFullName">Nombre y Apellidos Completos</label>
          <input type="text" id="regFullName" placeholder="Ej. Kelvin Ernesto Orozco" required>
        </div>

        <div class="form-group-field">
          <label for="regEmail">Correo Electrónico</label>
          <input type="email" id="regEmail" placeholder="ejemplo@correo.com" required>
        </div>

        <div class="form-group-field">
          <label for="regPass">Crea una Contraseña (mínimo 6 caracteres)</label>
          <input type="password" id="regPass" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary full" style="padding: 0.8rem; margin-top: 0.25rem;">
          Crear Cuenta Oficial
        </button>
      </form>

      <div class="auth-toggle-bar">
        <span id="toggleText">¿No tienes una cuenta aún?</span>
        <a class="auth-toggle-link" id="toggleAuthBtn">Regístrate aquí</a>
      </div>
    </div>
  </div>

  <!-- MODAL DE SELECCIÓN DE CUENTA DE GOOGLE SIMULADO -->
  <div class="google-modal-backdrop" id="googleModal">
    <div class="google-account-card">
      <div class="google-card-header">
        <svg width="32" height="32" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <h3>Elige una cuenta</h3>
        <p>para continuar en KEHO-Technology</p>
      </div>

      <div class="google-accounts-list">
        <!-- OPCIÓN 1: Tu cuenta principal -->
        <button type="button" class="account-item-btn" onclick="seleccionarCuentaGoogle('Kelvin Ernesto Orozco', 'kelvingoes2008@gmail.com')">
          <div class="account-avatar">K</div>
          <div class="account-details">
            <span class="account-name">Kelvin Ernesto Orozco</span>
            <span class="account-email">kelvingoes2008@gmail.com</span>
          </div>
        </button>

        <!-- OPCIÓN 2: Usar otra cuenta -->
        <button type="button" class="account-item-btn" onclick="usarOtraCuentaGoogle()">
          <div class="account-avatar" style="background: #334155; color: #fff;">+</div>
          <div class="account-details">
            <span class="account-name">Usar otra cuenta</span>
            <span class="account-email">Ingresar correo personalizado</span>
          </div>
        </button>
      </div>

      <button type="button" class="btn-close-google-modal" id="btnCloseGoogleModal">Cancelar</button>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="Iniciar.js" defer></script>
</body>
</html>
